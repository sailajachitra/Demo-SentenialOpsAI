<!doctype html>
<html lang="en">
<head>
<meta name="demo-depth" content="0">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>New password · SentinelOps AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="static/css/login.css" rel="stylesheet">
</head>
<body class="login-page">
<div class="stage">
  <section class="hero"><div class="hero-brand"><span class="mark">✦</span><span><b>SentinelOps</b><small>AI SECURITY OPERATIONS</small></span></div></section>
  <svg class="curve" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M80 0 C 71 22, 58 58, 53 100 L100 100 L100 0 Z"/></svg>
  <main class="card-wrap">
    <form class="card" method="post" novalidate>
      <h1>Set a new password</h1>
      <p class="lead">Email verified for <b>a****@example.com</b>.<br>Choose a new password (at least 8 characters).</p>
      
      <label for="password">New password<span>*</span></label>
      <input id="password" name="password" type="password" minlength="8" placeholder="Enter new password" autocomplete="new-password" required autofocus>
      <label for="confirm">Confirm password<span>*</span></label>
      <input id="confirm" name="confirm" type="password" minlength="8" placeholder="Re-enter new password" autocomplete="new-password" required>
      <button class="submit" type="submit">Update password</button>
      <a class="back" href="login.html">← Back to sign in</a>
    </form>
  </main>
</div>
<script src="static/js/dummy.js"></script>
</body></html>
